# System description - the human-editable source for the OSCAL SSP.
# Fictional system for portfolio purposes. Agency, vendor and people are invented.

system:
  id: FIP-2026-001
  name: Field Inspection Portal
  short_name: FIP
  version: "1.0"
  published: "2026-10-21"
  description: >
    The Field Inspection Portal (FIP) lets inspectors of the (fictional) Office of
    Facility Standards schedule site inspections, record findings on mobile
    devices, and publish compliance letters to facility operators. It is a
    multi-tier web application hosted in a commercial Azure region and operated
    by Fabrikam Digital Services under contract.
  sensitivity: moderate
  status: under-development      # operational | under-development | under-major-modification
  boundary: >
    The authorization boundary contains the FIP web front end (Azure App Service),
    the API tier (Azure App Service), the Azure SQL Database holding inspection
    records, the Azure Key Vault holding application secrets and keys, the Azure
    Front Door instance with Web Application Firewall, and the administrative
    workstations used to operate the system. Microsoft Entra ID, Azure platform
    services, Microsoft Sentinel and Defender for Cloud are external, FedRAMP
    authorized services leveraged by the system and are outside the boundary.
  network: >
    All inbound traffic terminates at Azure Front Door (WAF in prevention mode).
    The web and API tiers are reachable only from Front Door via service tags and
    access restrictions. The database and Key Vault expose private endpoints only;
    public network access is disabled. Administrative access uses Entra ID
    Privileged Identity Management and Intune-compliant workstations; there is no
    inbound RDP or SSH.
  data_flow: >
    Inspectors authenticate through Entra ID (phishing-resistant MFA), submit
    findings over TLS 1.2+ to the API tier, which writes to Azure SQL. Facility
    operators receive compliance letters through an authenticated portal view.
    All platform and application logs stream to a Log Analytics workspace that
    feeds Microsoft Sentinel.

# Information types. Impact levels follow FIPS 199 (low | moderate | high).
information_types:
  - title: Inspection Records
    description: Findings, photos and inspector notes for facility site inspections.
    c: moderate
    i: moderate
    a: low
  - title: Facility Operator Contact Information (PII)
    description: Names, business addresses, phone numbers and email of facility contacts.
    c: moderate
    i: moderate
    a: low
  - title: Compliance Determinations
    description: Official compliance letters and enforcement status published to operators.
    c: low
    i: moderate
    a: moderate
  - title: Security and Audit Data
    description: Authentication logs, audit trails, configuration and vulnerability data.
    c: moderate
    i: moderate
    a: low

roles:
  - {id: system-owner, title: System Owner}
  - {id: authorizing-official, title: Authorizing Official}
  - {id: isso, title: Information System Security Officer}
  - {id: system-administrator, title: System Administrator}
  - {id: inspector, title: Inspector (end user)}
  - {id: facility-operator, title: Facility Operator (external user)}

parties:
  - {id: agency, type: organization, name: Office of Facility Standards (fictional agency)}
  - {id: vendor, type: organization, name: Fabrikam Digital Services (fictional contractor)}

responsible_parties:
  system-owner: agency
  authorizing-official: agency
  isso: vendor
  system-administrator: vendor

users:
  - title: Inspector
    role: inspector
    privileges: [Create and edit own inspection records, View assigned facilities]
  - title: Facility Operator
    role: facility-operator
    privileges: [View own facility's compliance letters]
  - title: System Administrator
    role: system-administrator
    privileges: [Manage application configuration through PIM-activated roles, No standing access to production data]

# Components referenced by control statements.
components:
  - id: this-system
    type: this-system
    title: Field Inspection Portal
    description: The system as a whole.
  - id: entra-id
    type: service
    title: Microsoft Entra ID (leveraged)
    description: Identity provider - SSO, Conditional Access, PIM. External FedRAMP authorized service.
  - id: app-service
    type: service
    title: Azure App Service (web and API tiers)
    description: Hosts the FIP web front end and API. Managed identity, HTTPS only, minimum TLS 1.2.
  - id: azure-sql
    type: service
    title: Azure SQL Database
    description: Stores inspection records. Private endpoint only, TDE with customer-managed key.
  - id: key-vault
    type: service
    title: Azure Key Vault
    description: Holds secrets and the customer-managed encryption key. RBAC, purge protection.
  - id: front-door
    type: service
    title: Azure Front Door with WAF
    description: Single public entry point. Managed rule set in prevention mode.
  - id: sentinel
    type: service
    title: Log Analytics and Microsoft Sentinel (leveraged)
    description: Central log collection, analytics rules, incident management.
  - id: defender-cloud
    type: service
    title: Microsoft Defender for Cloud (leveraged)
    description: Posture management, vulnerability assessment, regulatory compliance dashboard.
  - id: admin-workstations
    type: hardware
    title: Administrative workstations
    description: Intune-managed, compliant devices required by Conditional Access for admin roles.
  - id: pipeline
    type: software
    title: CI/CD pipeline (GitHub Actions)
    description: Builds and deploys infrastructure as code and application releases with required reviews.
