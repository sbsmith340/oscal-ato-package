name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml jsonschema pytest
      - name: Build, cross-check and validate against NIST OSCAL schemas
        run: python tools/build.py --check
      - run: pytest -q tests
